<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Scrap Reports</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="apple-touch-icon" href="/assets/img/favicon.png">
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="/reports/reports-shared.css">
</head>

<body>

<script src="/reports/reports-header.js"></script>
<script>
function tt(key, fallback) { return window.I18n ? window.I18n.t(key) : fallback; }
document.getElementById('reports-page-title').textContent = tt('layout.scrapSummaryTitle', 'Scrap Summary');
</script>

<div class="reports-wrap">

  <a href="/reports/scrap/" class="reports-back-link" data-i18n="reports.backToScrapReports">← Back to Scrap Reports</a>

<div class="reports-section-intro">
<h2 class="reports-section-title" data-i18n="reports.scrapAnalyticsHeading">Scrap Analytics</h2>
<p class="reports-section-subtitle" data-i18n="reports.scrapAnalyticsSubtitle">
Monthly scrap totals and operational trend visibility.
</p>
</div>

<div class="card">

<div class="reports-field">
<label data-i18n="reports.selectMonthLabel">Select Month</label>
<input type="month" id="monthPicker">
</div>

<div class="reports-actions">
<button class="btn primary" onclick="loadReport()" data-i18n="reports.loadReportBtn">Load Report</button>
</div>

<p id="status" class="report-status"></p>

</div>

<div class="report-stats">

<div class="report-stat-card">
<div class="report-stat-label" data-i18n="reports.totalScrapLabel">Total Scrap</div>
<div class="report-stat-value" id="statScrap">--</div>
</div>

<div class="report-stat-card">
<div class="report-stat-label" data-i18n="reports.entriesLabel">Entries</div>
<div class="report-stat-value" id="statEntries">--</div>
</div>

</div>

<div class="card">
<h2 data-i18n="reports.scrapByWeekTitle">Scrap By Week</h2>

<div class="report-table-wrap">
<table class="report-table" id="weekTable">
<tr><th data-i18n="reports.weekCol">Week</th><th data-i18n="reports.boardFtCol">Board Ft</th></tr>
</table>
</div>

</div>

<div class="card">
<h2 data-i18n="reports.scrapByReasonSectionTitle">Scrap By Reason</h2>

<div class="report-table-wrap">
<table class="report-table" id="reasonTable">
<tr><th data-i18n="reports.reasonCol">Reason</th><th data-i18n="reports.boardFtCol">Board Ft</th></tr>
</table>
</div>

<div class="reports-platform-footer">
<a href="/" data-i18n="common.backToPlatform">← Back to Operations Platform</a>
</div>

</div>

</div>

<script>
function t(key, vars) { return window.I18n ? window.I18n.t(key, vars) : key; }

function num(v){
  const n = Number(v);
  return Number.isFinite(n) ? n : 0;
}

async function loadReport(){
  const month = document.getElementById("monthPicker").value;
  const status = document.getElementById("status");

  if(!month){
    status.textContent = t('reports.selectAMonth');
    status.classList.add("error");
    return;
  }

  status.textContent = t('reports.loadingDots');
  status.classList.remove("error");

  try {
    const { ok, data, error } = await window.api.get(`/api/reports/scrap-summary?month=${encodeURIComponent(month)}`);

    if(!ok){
      status.textContent = data?.error || error || t('reports.loadFailed');
      status.classList.add("error");
      return;
    }

    document.getElementById("statScrap").textContent =
      num(data.total_scrap_board_ft).toFixed(2);

    document.getElementById("statEntries").textContent =
      num(data.entry_count);

    const weekTable = document.getElementById("weekTable");
    weekTable.innerHTML = `<tr><th>${t('reports.weekCol')}</th><th>${t('reports.boardFtCol')}</th></tr>`;

    if (Array.isArray(data.by_week) && data.by_week.length) {
      data.by_week.forEach(w => {
        weekTable.innerHTML += `
          <tr>
            <td>${w.week_number}</td>
            <td>${num(w.scrap_board_ft).toFixed(2)}</td>
          </tr>`;
      });
    } else {
      weekTable.innerHTML += `
        <tr>
          <td colspan="2" class="report-empty">${t('reports.noWeeklyData')}</td>
        </tr>`;
    }

    const reasonTable = document.getElementById("reasonTable");
    reasonTable.innerHTML = `<tr><th>${t('reports.reasonCol')}</th><th>${t('reports.boardFtCol')}</th></tr>`;

    if (Array.isArray(data.by_reason) && data.by_reason.length) {
      data.by_reason.forEach(r => {
        reasonTable.innerHTML += `
          <tr>
            <td>${r.scrap_reason}</td>
            <td>${num(r.scrap_board_ft).toFixed(2)}</td>
          </tr>`;
      });
    } else {
      reasonTable.innerHTML += `
        <tr>
          <td colspan="2" class="report-empty">${t('reports.noReasonData')}</td>
        </tr>`;
    }

    status.textContent = t('reports.loadedMonth', { month });
  } catch (err) {
    status.textContent = t('reports.errorPrefix', { msg: err.message });
    status.classList.add("error");
  }
}

function setDefaultMonth() {
  const picker = document.getElementById("monthPicker");
  const now = new Date();
  const year = now.getFullYear();
  const month = String(now.getMonth() + 1).padStart(2, "0");
  picker.value = `${year}-${month}`;
}

document.addEventListener("DOMContentLoaded", () => {
  setDefaultMonth();
  loadReport();
});
</script>

</body>
</html>
