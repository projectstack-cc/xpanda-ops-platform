<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Incident Trend</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="apple-touch-icon" href="/assets/img/favicon.png">
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="/reports/reports-shared.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<script src="/reports/reports-header.js"></script>
<script>
function tt(key, fallback) { return window.I18n ? window.I18n.t(key) : fallback; }
document.getElementById('reports-page-title').textContent = tt('layout.incidentTrendTitle', 'Incident Trend');
</script>

<div class="reports-wrap">

<a href="/reports/incidents/" class="reports-back-link" data-i18n="reports.backToIncidentReports">← Back to Incident Reports</a>

<div class="reports-section-intro">
  <h2 class="reports-section-title" data-i18n="layout.incidentTrendTitle">Incident Trend</h2>
  <p class="reports-section-subtitle" data-i18n="reports.incidentTrendSubtitle">
    Yearly incident count by month with chart view switching.
  </p>
</div>

<div class="card">
  <div class="reports-actions">
    <div class="reports-field" style="min-width: 180px; margin-bottom: 0;">
      <label for="yearPicker" data-i18n="reports.selectYearLabel">Select Year</label>
      <select id="yearPicker"></select>
    </div>

    <div class="reports-field" style="min-width: 160px; margin-bottom: 0;">
      <label for="chartTypePicker" data-i18n="reports.chartTypeLabel">Chart Type</label>
      <select id="chartTypePicker">
        <option value="bar" data-i18n="reports.chartTypeBar">Bar</option>
        <option value="line" data-i18n="reports.chartTypeLine">Line</option>
      </select>
    </div>

    <button class="btn primary" type="button" id="loadBtn" data-i18n="reports.loadReportBtn">Load Report</button>
  </div>

  <p id="status" class="report-status"></p>
</div>

<div class="report-stats">
  <div class="report-stat-card">
    <div class="report-stat-label" data-i18n="reports.totalIncidentsLabel">Total Incidents</div>
    <div class="report-stat-value" id="statTotal">--</div>
  </div>

  <div class="report-stat-card">
    <div class="report-stat-label" data-i18n="reports.highestMonthLabel">Highest Month</div>
    <div class="report-stat-value" id="statPeak">--</div>
  </div>
</div>

<div class="card">
  <h2 data-i18n="reports.incidentCountByMonthTitle">Incident Count by Month</h2>
  <div class="report-chart-wrap">
    <canvas id="incidentTrendChart"></canvas>
  </div>
</div>

<div class="card">
  <h2 data-i18n="reports.monthlyTotalsTitle">Monthly Totals</h2>
  <div class="report-table-wrap">
    <table class="report-table" id="trendTable">
      <tr>
        <th data-i18n="reports.monthCol">Month</th>
        <th data-i18n="reports.incidentCountCol">Incident Count</th>
      </tr>
    </table>
  </div>
</div>

<div class="reports-platform-footer">
  <a href="/" data-i18n="common.backToPlatform">← Back to Operations Platform</a>
</div>

</div>

<script>
function t(key, vars) { return window.I18n ? window.I18n.t(key, vars) : key; }

let incidentTrendChart = null;
let currentLabels = [];
let currentValues = [];
let currentMonths = [];

function monthName(monthPart) {
  return monthPart ? t('reports.month' + monthPart) : '';
}

function num(v) {
  const n = Number(v);
  return Number.isFinite(n) ? n : 0;
}

function buildYearOptions() {
  const yearPicker = document.getElementById("yearPicker");
  const currentYear = new Date().getFullYear();

  yearPicker.innerHTML = "";

  for (let year = currentYear; year >= 2025; year--) {
    const opt = document.createElement("option");
    opt.value = String(year);
    opt.textContent = String(year);
    yearPicker.appendChild(opt);
  }

  yearPicker.value = String(currentYear);
}

function renderChart() {
  const chartType = document.getElementById("chartTypePicker").value;
  const ctx = document.getElementById("incidentTrendChart");

  if (incidentTrendChart) {
    incidentTrendChart.destroy();
  }

  incidentTrendChart = new Chart(ctx, {
    type: chartType,
    data: {
      labels: currentLabels,
      datasets: [{
        label: t('reports.incidentCountCol'),
        data: currentValues,
        tension: chartType === "line" ? 0.25 : 0,
        fill: false
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      onClick: (_, elements) => {
        if (!elements.length) return;

        const year = document.getElementById("yearPicker").value;
        const month = currentMonths[elements[0].index];

        if (!year || !month) return;

        window.location.href =
          `/reports/incidents/list.html?year=${encodeURIComponent(year)}&month=${encodeURIComponent(month)}`;
      },
      plugins: {
        legend: { display: false }
      },
      scales: {
        y: {
          beginAtZero: true,
          ticks: {
            precision: 0
          }
        }
      }
    }
  });
}

async function loadTrendReport() {
  const year = document.getElementById("yearPicker").value;
  const status = document.getElementById("status");

  if (!year) {
    status.textContent = t('reports.selectAYear');
    status.classList.add("error");
    return;
  }

  status.textContent = t('reports.loadingDots');
  status.classList.remove("error");

  try {
    const { ok, data, error } = await window.api.get(`/api/reports/incidents-trend?year=${encodeURIComponent(year)}`);

    if (!ok) {
      status.textContent = data?.error || error || t('reports.loadFailed');
      status.classList.add("error");
      return;
    }

    currentLabels = data.months.map(row => {
      const monthPart = row.month.split("-")[1];
      return monthName(monthPart) || row.month;
    });

    currentMonths = data.months.map(row => row.month);
    currentValues = data.months.map(row => num(row.count));

    document.getElementById("statTotal").textContent = num(data.total);

    let peakLabel = "--";
    let peakCount = -1;

    data.months.forEach(row => {
      const count = num(row.count);
      if (count > peakCount) {
        peakCount = count;
        peakLabel = `${monthName(row.month.split("-")[1])} (${count})`;
      }
    });

    document.getElementById("statPeak").textContent = peakCount >= 0 ? peakLabel : "--";

    renderChart();

    const table = document.getElementById("trendTable");
    table.innerHTML = `
      <tr>
        <th>${t('reports.monthCol')}</th>
        <th>${t('reports.incidentCountCol')}</th>
      </tr>
    `;

    data.months.forEach(row => {
      const monthPart = row.month.split("-")[1];
      table.innerHTML += `
        <tr>
          <td>${monthName(monthPart) || row.month}</td>
          <td>${num(row.count)}</td>
        </tr>
      `;
    });

    status.textContent = t('reports.loadedYear', { year });
  } catch (err) {
    status.textContent = t('reports.errorPrefix', { msg: err.message });
    status.classList.add("error");
  }
}

document.getElementById("loadBtn").addEventListener("click", loadTrendReport);
document.getElementById("chartTypePicker").addEventListener("change", () => {
  if (currentLabels.length && currentValues.length) {
    renderChart();
  }
});

document.addEventListener("DOMContentLoaded", () => {
  buildYearOptions();
  loadTrendReport();
});
</script>

</body>
</html>
