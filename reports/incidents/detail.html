<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Incident Detail</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="apple-touch-icon" href="/assets/img/favicon.png">
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="/reports/reports-shared.css">
<style>
.detail-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.detail-field {
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 12px;
  background: var(--card-bg);
}

.detail-field.full {
  grid-column: 1 / -1;
}

.detail-label {
  margin: 0 0 6px;
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .4px;
  color: var(--muted);
}

.detail-value {
  font-size: 14px;
  line-height: 1.5;
  white-space: pre-wrap;
  word-break: break-word;
}

@media (max-width: 640px) {
  .detail-grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<script src="/reports/reports-header.js"></script>
<script>
function tt(key, fallback) { return window.I18n ? window.I18n.t(key) : fallback; }
document.getElementById('reports-page-title').textContent = tt('layout.incidentDetailTitle', 'Incident Detail');
document.querySelector('.topbar p').textContent = tt('layout.incidentDetailSubtitle', 'Read-only incident visibility from the incident tracker.');
</script>

<div class="reports-wrap">

<a href="/reports/incidents/list.html" class="reports-back-link" data-i18n="reports.backToIncidentList">← Back to Incident List</a>

<div class="reports-section-intro">
  <h2 class="reports-section-title" data-i18n="layout.incidentDetailTitle">Incident Detail</h2>
  <p class="reports-section-subtitle" data-i18n="layout.incidentDetailSubtitle">
    Read-only incident visibility from the incident tracker.
  </p>
</div>

<div class="card">
  <p id="status" class="report-status" style="display:none;"></p>
</div>

<div id="content" style="display: none;">
  <div class="card">
    <h2 data-i18n="reports.incidentOverviewTitle">Incident Overview</h2>
    <div class="detail-grid">
      <div class="detail-field">
        <div class="detail-label" data-i18n="reports.dateLabel">Date</div>
        <div class="detail-value" id="fieldDate">--</div>
      </div>
      <div class="detail-field">
        <div class="detail-label" data-i18n="reports.customerLabel">Customer</div>
        <div class="detail-value" id="fieldCustomer">--</div>
      </div>
      <div class="detail-field">
        <div class="detail-label" data-i18n="reports.incidentTypeLabel">Incident Type</div>
        <div class="detail-value" id="fieldIncidentType">--</div>
      </div>
      <div class="detail-field">
        <div class="detail-label" data-i18n="reports.riskLevelLabel">Risk Level</div>
        <div class="detail-value" id="fieldRiskLevel">--</div>
      </div>
    </div>
  </div>

  <div class="card">
    <h2 data-i18n="reports.classificationTitle">Classification</h2>
    <div class="detail-grid">
      <div class="detail-field">
        <div class="detail-label" data-i18n="reports.monthLabel">Month</div>
        <div class="detail-value" id="fieldMonth">--</div>
      </div>
      <div class="detail-field">
        <div class="detail-label" data-i18n="reports.yearLabel">Year</div>
        <div class="detail-value" id="fieldYear">--</div>
      </div>
    </div>
  </div>

  <div class="card">
    <h2 data-i18n="reports.summaryLabel">Summary</h2>
    <div class="detail-grid">
      <div class="detail-field full">
        <div class="detail-label" data-i18n="reports.summaryLabel">Summary</div>
        <div class="detail-value" id="fieldSummary">--</div>
      </div>
    </div>
  </div>
</div>

<div class="reports-platform-footer">
  <a href="/" data-i18n="common.backToPlatform">← Back to Operations Platform</a>
</div>

</div>

<script>
function t(key, vars) { return window.I18n ? window.I18n.t(key, vars) : key; }

function getQueryParam(name) {
  return new URLSearchParams(window.location.search).get(name) || "";
}

function setText(id, value) {
  document.getElementById(id).textContent = value || "--";
}

function renderIncident(item) {
  setText("fieldDate", item.date);
  setText("fieldCustomer", item.customer);
  setText("fieldIncidentType", item.incident_type);
  setText("fieldRiskLevel", item.risk_level);
  setText("fieldMonth", item.month);
  setText("fieldYear", item.year);
  setText("fieldSummary", item.summary);
}

async function loadIncident() {
  const id = getQueryParam("id");
  const status = document.getElementById("status");
  const content = document.getElementById("content");

  if (!id) {
    status.style.display = "block";
    status.textContent = t('reports.missingIncidentId');
    status.classList.add("error");
    return;
  }

  status.style.display = "block";
  status.textContent = t('reports.loadingDots');
  status.classList.remove("error");

  try {
    const { ok, data, status: httpStatus } = await window.api.get(
      `/api/reports/incidents-detail?id=${encodeURIComponent(id)}`
    );

    if (httpStatus === 404) {
      status.style.display = "block";
      status.textContent = t('reports.incidentNotFound');
      status.classList.add("error");
      return;
    }

    if (!ok || !data || !data.item) {
      status.style.display = "block";
      status.textContent = t('reports.unableToLoadIncident');
      status.classList.add("error");
      return;
    }

    renderIncident(data.item);
    content.style.display = "block";
    status.style.display = "none";
    status.textContent = "";
  } catch (err) {
    status.style.display = "block";
    status.textContent = t('reports.unableToLoadIncident');
    status.classList.add("error");
  }
}

document.addEventListener("DOMContentLoaded", loadIncident);
</script>

</body>
</html>
