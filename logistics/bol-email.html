<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BOL Email Queue — xPanda Operations</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="/manifest.json">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">

<link rel="icon" href="/assets/img/favicon.png" sizes="any">
<link rel="apple-touch-icon" href="/assets/img/favicon.png">

<style>
  .bol-email-wrap {
    max-width: 1180px;
    margin: 0 auto;
    padding: 20px 16px 60px;
  }
  .bol-email-columns {
    display: flex;
    gap: 20px;
    align-items: flex-start;
  }
  .bol-email-col-main {
    flex: 1 1 640px;
    min-width: 0;
  }
  .bol-email-col-side {
    flex: 0 0 320px;
    min-width: 0;
  }
  @media (max-width: 820px) {
    .bol-email-columns {
      flex-direction: column;
    }
    .bol-email-col-side {
      flex: 1 1 auto;
      width: 100%;
    }
  }
  .bol-email-panel {
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--card-bg);
    padding: 14px;
  }
  .bol-email-panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .bol-email-panel-header h3 {
    margin: 0;
    font-size: 15px;
    color: var(--text);
  }
  .bol-email-small-btn {
    background: none;
    border: 1px solid var(--input-border);
    border-radius: 6px;
    color: var(--text);
    font-size: 12px;
    font-weight: 600;
    padding: 6px 10px;
    min-height: 44px;
    cursor: pointer;
  }
  .bol-email-recipients-list {
    max-height: 340px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .bol-email-recipient-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 4px;
    border-bottom: 1px solid var(--line);
    min-height: 44px;
  }
  .bol-email-recipient-row:last-child { border-bottom: none; }
  .bol-email-recipient-row label {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: var(--text);
    cursor: pointer;
  }
  .bol-email-recipient-row input[type="checkbox"] {
    width: 20px;
    height: 20px;
    min-width: 20px;
    cursor: pointer;
  }
  .bol-email-recipient-actions {
    display: flex;
    gap: 4px;
  }
  .bol-email-recipient-actions button {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 16px;
    cursor: pointer;
    padding: 6px;
    min-width: 44px;
    min-height: 44px;
  }
  .bol-email-recipient-edit-row {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 8px 4px;
    border-bottom: 1px solid var(--line);
  }
  .bol-email-recipient-edit-row input {
    padding: 8px 10px;
    border: 1px solid var(--input-border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    min-height: 40px;
  }
  .bol-email-recipient-edit-row .bol-email-edit-actions {
    display: flex;
    gap: 8px;
  }
  .bol-email-add-recipient {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--line);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .bol-email-add-recipient input {
    padding: 8px 10px;
    border: 1px solid var(--input-border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    min-height: 40px;
  }
  .bol-email-holidays {
    margin-top: 20px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--card-bg);
    padding: 4px 14px 14px;
  }
  .bol-email-holidays > summary {
    cursor: pointer;
    padding: 12px 0;
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
  }
  .bol-email-holiday-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 4px;
    border-bottom: 1px solid var(--line);
    font-size: 13px;
    color: var(--text);
    min-height: 44px;
  }
  .bol-email-holiday-row .muted { color: var(--muted); }
  .bol-email-holiday-row button {
    margin-left: auto;
    background: none;
    border: none;
    color: var(--muted);
    font-size: 16px;
    cursor: pointer;
    padding: 6px;
    min-width: 44px;
    min-height: 44px;
  }
  .bol-email-add-holiday {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--line);
  }
  .bol-email-add-holiday input[type="date"],
  .bol-email-add-holiday input[type="text"] {
    padding: 8px 10px;
    border: 1px solid var(--input-border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    min-height: 40px;
  }
  .bol-email-add-holiday input[type="text"] { flex: 1; min-width: 140px; }
  .bol-email-sendinfo {
    font-size: 13px;
    color: var(--muted);
    margin: 0 auto 0 0;
    align-self: center;
  }
  .bol-email-intro {
    color: var(--muted);
    margin: 0 0 18px;
    font-size: 14px;
  }
  .bol-email-toolbar {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
    margin-bottom: 16px;
  }
  .bol-email-toolbar input[type="text"] {
    flex: 1;
    min-width: 220px;
    padding: 10px 12px;
    border: 1px solid var(--input-border);
    border-radius: 8px;
    background: var(--card-bg);
    color: var(--text);
    font-size: 14px;
    min-height: 44px;
  }
  .bol-email-search-results {
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--card-bg);
    margin: -8px 0 16px;
    max-height: 260px;
    overflow-y: auto;
    display: none;
  }
  .bol-email-search-results.open { display: block; }
  .bol-email-search-row {
    padding: 10px 12px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    font-size: 13px;
    color: var(--text);
  }
  .bol-email-search-row:last-child { border-bottom: none; }
  .bol-email-search-row:hover { background: var(--bg); }
  .bol-email-list {
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--card-bg);
    overflow: hidden;
  }
  .bol-email-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--line);
  }
  .bol-email-row:last-child { border-bottom: none; }
  .bol-email-row input[type="checkbox"] {
    width: 20px;
    height: 20px;
    min-width: 20px;
    cursor: pointer;
  }
  .bol-email-row-label {
    flex: 1;
    font-size: 14px;
    color: var(--text);
  }
  .bol-email-row-label .muted { color: var(--muted); }
  .bol-email-badge-warn {
    display: inline-block;
    margin-left: 8px;
    padding: 2px 8px;
    border-radius: 999px;
    background: #fef3c7;
    color: #92400e;
    font-size: 11px;
    font-weight: 700;
  }
  .bol-email-remove-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 18px;
    cursor: pointer;
    line-height: 1;
    padding: 4px 8px;
    min-height: 44px;
  }
  .bol-email-empty {
    padding: 32px 16px;
    text-align: center;
    color: var(--text-hint);
    font-size: 14px;
  }
  .bol-email-send-bar {
    margin-top: 18px;
    display: flex;
    justify-content: flex-end;
  }
</style>
</head>
<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>

<script src="/logistics/bol-shared.js?v=317"></script>

<script src="/logistics/logistics-header.js"></script>
<script>
document.getElementById('logistics-page-title').textContent = 'BOL Email Queue';
document.getElementById('logistics-page-subtitle').textContent = "Next shipping day's Lisma shipments";
</script>

<div class="bol-email-wrap">
  <p class="bol-email-intro" id="bol-email-intro">BOL Email Queue — next shipping day's Lisma shipments</p>

  <div class="bol-email-columns">
    <div class="bol-email-col-main">
      <div class="bol-email-toolbar">
        <input type="text" id="bol-email-search-input" placeholder="Add a BOL manually — search by customer or BOL #…" autocomplete="off">
      </div>
      <div class="bol-email-search-results" id="bol-email-search-results"></div>

      <div class="bol-email-list" id="bol-email-list">
        <div class="bol-email-empty" id="bol-email-empty">Loading…</div>
      </div>

      <div class="bol-email-send-bar">
        <span class="bol-email-sendinfo" id="bol-email-sendinfo"></span>
        <button class="logistics-btn logistics-btn-primary" id="bol-email-send-btn" onclick="sendNow()" disabled>Send</button>
      </div>
    </div>

    <div class="bol-email-col-side">
      <div class="bol-email-panel">
        <div class="bol-email-panel-header">
          <h3>Recipients</h3>
          <button class="bol-email-small-btn" id="bol-email-edit-toggle" onclick="toggleRecipientEdit()">Edit</button>
        </div>
        <div class="bol-email-recipients-list" id="bol-email-recipients"></div>
      </div>
    </div>
  </div>

  <details class="bol-email-holidays">
    <summary>Plant closures (skipped when picking the ship day)</summary>
    <div id="bol-email-holidays-list"></div>
    <div class="bol-email-add-holiday">
      <input type="date" id="bol-email-holiday-date">
      <input type="text" id="bol-email-holiday-label" placeholder="Label (e.g. Thanksgiving)">
      <button class="bol-email-small-btn" onclick="submitAddHoliday()">Add</button>
    </div>
  </details>
</div>

<script>
(function () {
  const LISMA_RE = /^LISMA/i;

  let shipDate = '';
  // rows: Map<id, { record, checked, nonLisma }>
  const rows = new Map();
  let renderCache = new Map(); // id -> { pdfBytes, filename }

  // ── Recipients + holidays state ────────────────────────────────────────
  let recipients = [];
  const checkedRecipientIds = new Set();
  let editMode = false;
  let editingRecipientId = null;
  let holidays = [];

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function fieldOr(v) {
    return (v === null || v === undefined || v === '') ? '—' : esc(v);
  }

  function isNonLisma(record) {
    return !LISMA_RE.test(String(record.carrier_name || ''));
  }

  function labelFor(record) {
    const customer = fieldOr(record.customer);
    const invBol = fieldOr(record.invoice_number || record.bol_number);
    const load = fieldOr(record.load_number);
    const trailer = fieldOr(record.trailer_number);
    const bay = fieldOr(record.bay_number || record.bay_label);
    return `${customer} <span class="muted">·</span> ${invBol} <span class="muted">· Load ${load} · Trailer ${trailer} · Bay ${bay}</span>`;
  }

  function renderList() {
    const listEl = document.getElementById('bol-email-list');

    if (rows.size === 0) {
      listEl.innerHTML = '';
      listEl.appendChild(emptyElNode());
      updateSendBar();
      return;
    }

    listEl.innerHTML = '';
    for (const [id, entry] of rows) {
      const row = document.createElement('div');
      row.className = 'bol-email-row';
      row.innerHTML = `
        <input type="checkbox" data-id="${esc(id)}" ${entry.checked ? 'checked' : ''}>
        <div class="bol-email-row-label">${labelFor(entry.record)}${entry.nonLisma ? '<span class="bol-email-badge-warn">Not Lisma</span>' : ''}</div>
        <button class="bol-email-remove-btn" data-remove="${esc(id)}" title="Remove">×</button>
      `;
      listEl.appendChild(row);
    }

    listEl.querySelectorAll('input[type="checkbox"]').forEach(cb => {
      cb.addEventListener('change', () => {
        const id = cb.dataset.id;
        if (rows.has(id)) rows.get(id).checked = cb.checked;
        renderList();
      });
    });
    listEl.querySelectorAll('[data-remove]').forEach(btn => {
      btn.addEventListener('click', () => {
        rows.delete(btn.dataset.remove);
        renderList();
      });
    });

    updateSendBar();
  }

  function emptyElNode() {
    const div = document.createElement('div');
    div.className = 'bol-email-empty';
    div.id = 'bol-email-empty';
    div.textContent = `No Lisma BOLs found for the next shipping day (${shipDate || '—'}).`;
    return div;
  }

  function updateSendBar() {
    const sendBtn = document.getElementById('bol-email-send-btn');
    const info = document.getElementById('bol-email-sendinfo');
    const bolCount = [...rows.values()].filter(e => e.checked).length;
    const recCount = checkedRecipientIds.size;
    if (info) {
      info.textContent = `Shipping ${shipDate || '—'} · ${bolCount} BOL${bolCount === 1 ? '' : 's'} · ${recCount} recipient${recCount === 1 ? '' : 's'}`;
    }
    if (sendBtn) sendBtn.disabled = bolCount === 0 || recCount === 0;
  }

  async function loadCandidates() {
    const { ok, data, error } = await window.api.get('/api/bol-email/candidates');
    if (!ok) {
      document.getElementById('bol-email-list').innerHTML = '';
      document.getElementById('bol-email-list').appendChild(Object.assign(document.createElement('div'), {
        className: 'bol-email-empty', textContent: 'Failed to load candidates: ' + (error || 'unknown error'),
      }));
      return;
    }
    shipDate = data.ship_date || '';
    document.getElementById('bol-email-intro').textContent = `BOL Email Queue — Lisma shipments for ${shipDate}`;
    rows.clear();
    for (const record of (data.candidates || [])) {
      rows.set(record.id, { record, checked: true, nonLisma: isNonLisma(record) });
    }
    renderList();
  }

  // ── Add BOL manually (search) ──────────────────────────────────────────
  let searchTimer = null;
  const searchInput = document.getElementById('bol-email-search-input');
  const searchResults = document.getElementById('bol-email-search-results');

  searchInput.addEventListener('input', () => {
    clearTimeout(searchTimer);
    const term = searchInput.value.trim();
    if (!term) {
      searchResults.classList.remove('open');
      searchResults.innerHTML = '';
      return;
    }
    searchTimer = setTimeout(() => runSearch(term), 250);
  });

  async function runSearch(term) {
    const { ok, data } = await window.api.get('/api/bols?search=' + encodeURIComponent(term));
    if (!ok || !data || !Array.isArray(data.bols)) {
      searchResults.innerHTML = '';
      searchResults.classList.remove('open');
      return;
    }
    const results = data.bols.slice(0, 20);
    if (results.length === 0) {
      searchResults.innerHTML = '<div class="bol-email-search-row">No matches.</div>';
      searchResults.classList.add('open');
      return;
    }
    searchResults.innerHTML = results.map(r => `
      <div class="bol-email-search-row" data-add="${esc(r.id)}">${labelFor(r)}</div>
    `).join('');
    searchResults.classList.add('open');
    searchResults.querySelectorAll('[data-add]').forEach(el => {
      el.addEventListener('click', () => {
        const id = el.dataset.add;
        const record = results.find(r => String(r.id) === String(id));
        if (record && !rows.has(record.id)) {
          rows.set(record.id, { record, checked: true, nonLisma: isNonLisma(record) });
          renderList();
        }
        searchInput.value = '';
        searchResults.classList.remove('open');
        searchResults.innerHTML = '';
      });
    });
  }

  document.addEventListener('click', (e) => {
    if (!searchResults.contains(e.target) && e.target !== searchInput) {
      searchResults.classList.remove('open');
    }
  });

  // ── Recipients ──────────────────────────────────────────────────────────
  function renderRecipients() {
    const el = document.getElementById('bol-email-recipients');
    el.innerHTML = '';

    for (const r of recipients) {
      if (editMode && editingRecipientId === r.id) {
        const editRow = document.createElement('div');
        editRow.className = 'bol-email-recipient-edit-row';
        editRow.innerHTML = `
          <input type="text" id="bol-email-edit-name-${r.id}" value="${esc(r.name)}" placeholder="Name">
          <input type="email" id="bol-email-edit-email-${r.id}" value="${esc(r.email)}" placeholder="email@example.com">
          <div class="bol-email-edit-actions">
            <button class="bol-email-small-btn" data-save-rid="${r.id}">Save</button>
            <button class="bol-email-small-btn" data-cancel-edit-rid>Cancel</button>
          </div>
        `;
        el.appendChild(editRow);
        continue;
      }

      const row = document.createElement('div');
      row.className = 'bol-email-recipient-row';
      const checked = checkedRecipientIds.has(r.id);
      const displayName = r.name ? `${esc(r.name)} — ` : '';
      row.innerHTML = `
        <label>
          <input type="checkbox" data-rid="${r.id}" ${checked ? 'checked' : ''}>
          <span>${displayName}${esc(r.email)}</span>
        </label>
        ${editMode ? `<div class="bol-email-recipient-actions">
          <button data-edit-rid="${r.id}" title="Edit">&#9998;</button>
          <button data-remove-rid="${r.id}" title="Remove">&times;</button>
        </div>` : ''}
      `;
      el.appendChild(row);
    }

    el.querySelectorAll('input[type="checkbox"][data-rid]').forEach(cb => {
      cb.addEventListener('change', () => {
        const id = Number(cb.dataset.rid);
        if (cb.checked) checkedRecipientIds.add(id); else checkedRecipientIds.delete(id);
        updateSendBar();
      });
    });

    if (editMode) {
      el.querySelectorAll('[data-edit-rid]').forEach(btn => {
        btn.addEventListener('click', () => {
          editingRecipientId = Number(btn.dataset.editRid);
          renderRecipients();
        });
      });
      el.querySelectorAll('[data-remove-rid]').forEach(btn => {
        btn.addEventListener('click', () => {
          if (confirm('Remove this recipient?')) deleteRecipient(Number(btn.dataset.removeRid));
        });
      });
      el.querySelectorAll('[data-save-rid]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = Number(btn.dataset.saveRid);
          const name = document.getElementById(`bol-email-edit-name-${id}`).value.trim();
          const email = document.getElementById(`bol-email-edit-email-${id}`).value.trim();
          editingRecipientId = null;
          updateRecipient(id, email, name);
        });
      });
      el.querySelectorAll('[data-cancel-edit-rid]').forEach(btn => {
        btn.addEventListener('click', () => {
          editingRecipientId = null;
          renderRecipients();
        });
      });

      const addRow = document.createElement('div');
      addRow.className = 'bol-email-add-recipient';
      addRow.innerHTML = `
        <input type="text" id="bol-email-new-name" placeholder="Name (optional)">
        <input type="email" id="bol-email-new-email" placeholder="email@example.com">
        <button class="bol-email-small-btn" id="bol-email-new-save">+ Add recipient</button>
      `;
      el.appendChild(addRow);
      document.getElementById('bol-email-new-save').addEventListener('click', () => {
        const name = document.getElementById('bol-email-new-name').value.trim();
        const email = document.getElementById('bol-email-new-email').value.trim();
        addRecipient(email, name);
      });
    }

    updateSendBar();
  }

  window.toggleRecipientEdit = function () {
    editMode = !editMode;
    editingRecipientId = null;
    document.getElementById('bol-email-edit-toggle').textContent = editMode ? 'Done' : 'Edit';
    renderRecipients();
  };

  async function loadRecipients() {
    const { ok, data, error } = await window.api.get('/api/bol-email/recipients');
    if (!ok) {
      alert('Failed to load recipients: ' + (error || 'unknown error'));
      return;
    }
    const prevIds = new Set(recipients.map(r => r.id));
    recipients = data.recipients || [];
    for (const r of recipients) {
      if (!prevIds.has(r.id)) {
        if (r.is_selected) checkedRecipientIds.add(r.id); else checkedRecipientIds.delete(r.id);
      }
    }
    renderRecipients();
  }

  async function addRecipient(email, name) {
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      alert('Enter a valid email.');
      return;
    }
    const { ok, data, error } = await window.api.post('/api/bol-email/recipients', { email, name });
    if (!ok) {
      alert('Failed to add recipient: ' + (data?.error || error || 'Unknown error'));
      return;
    }
    await loadRecipients();
  }

  async function updateRecipient(id, email, name) {
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      alert('Enter a valid email.');
      renderRecipients();
      return;
    }
    const { ok, data, error } = await window.api.put(`/api/bol-email/recipients/${id}`, { email, name });
    if (!ok) {
      alert('Failed to update recipient: ' + (data?.error || error || 'Unknown error'));
    }
    await loadRecipients();
  }

  async function deleteRecipient(id) {
    const { ok, data, error } = await window.api.del(`/api/bol-email/recipients/${id}`);
    if (!ok) {
      alert('Failed to remove recipient: ' + (data?.error || error || 'Unknown error'));
      return;
    }
    checkedRecipientIds.delete(id);
    await loadRecipients();
  }

  // ── Plant holidays ──────────────────────────────────────────────────────
  function renderHolidays() {
    const el = document.getElementById('bol-email-holidays-list');
    if (holidays.length === 0) {
      el.innerHTML = '<div class="bol-email-holiday-row"><span class="muted">No plant closures listed.</span></div>';
      return;
    }
    el.innerHTML = holidays.map(h => `
      <div class="bol-email-holiday-row">
        <span>${esc(h.holiday_date)}</span>
        <span class="muted">${h.label ? esc(h.label) : ''}</span>
        <button data-remove-hid="${h.id}" title="Remove">&times;</button>
      </div>
    `).join('');
    el.querySelectorAll('[data-remove-hid]').forEach(btn => {
      btn.addEventListener('click', () => {
        if (confirm('Remove this plant closure date?')) deleteHoliday(Number(btn.dataset.removeHid));
      });
    });
  }

  async function loadHolidays() {
    const { ok, data, error } = await window.api.get('/api/bol-email/holidays');
    if (!ok) {
      alert('Failed to load plant closures: ' + (error || 'unknown error'));
      return;
    }
    holidays = data.holidays || [];
    renderHolidays();
  }

  window.submitAddHoliday = async function () {
    const date = document.getElementById('bol-email-holiday-date').value;
    const label = document.getElementById('bol-email-holiday-label').value.trim();
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) {
      alert('Pick a date.');
      return;
    }
    const { ok, data, error } = await window.api.post('/api/bol-email/holidays', { holiday_date: date, label });
    if (!ok) {
      alert('Failed to add closure: ' + (data?.error || error || 'Unknown error'));
      return;
    }
    document.getElementById('bol-email-holiday-date').value = '';
    document.getElementById('bol-email-holiday-label').value = '';
    await loadHolidays();
    loadCandidates();
  };

  async function deleteHoliday(id) {
    const { ok, data, error } = await window.api.del(`/api/bol-email/holidays/${id}`);
    if (!ok) {
      alert('Failed to remove closure: ' + (data?.error || error || 'Unknown error'));
      return;
    }
    await loadHolidays();
    loadCandidates();
  }

  // ── Send flow (no modal) ───────────────────────────────────────────────
  function bytesToBase64(bytes) {
    let bin = '';
    const CH = 0x8000;
    for (let i = 0; i < bytes.length; i += CH) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
    }
    return btoa(bin);
  }

  function filenameFor(record) {
    const inv = record.invoice_number || record.bol_number || record.id;
    const cust = String(record.customer || '').replace(/[^\w-]+/g, '_');
    return `BOL-${inv}-${cust}.pdf`;
  }

  window.sendNow = async function () {
    const selected = [...rows.values()].filter(e => e.checked);
    if (selected.length === 0) {
      alert('Select at least one BOL to send.');
      return;
    }
    if (checkedRecipientIds.size === 0) {
      alert('Select at least one recipient.');
      return;
    }
    if (!window.BolShared || !window.PDFLib) {
      alert('BOL renderer failed to load. Refresh the page and try again.');
      return;
    }

    const sendBtn = document.getElementById('bol-email-send-btn');
    sendBtn.disabled = true;
    sendBtn.textContent = 'Rendering…';

    renderCache = new Map();
    try {
      for (const entry of selected) {
        const { pdfBytes } = await window.BolShared.generatePdf([entry.record], { previewOnly: true, copyType: 'driver' });
        renderCache.set(entry.record.id, { pdfBytes, filename: filenameFor(entry.record) });
      }
    } catch (e) {
      console.error('BOL render failed:', e);
      alert('Failed to render one or more BOLs: ' + (e?.message || e));
      sendBtn.disabled = false;
      sendBtn.textContent = 'Send';
      return;
    }

    const attachments = [...renderCache.values()].map(v => ({
      filename: v.filename,
      content: bytesToBase64(v.pdfBytes),
    }));

    sendBtn.textContent = 'Sending…';

    const { ok, data, error } = await window.api.post('/api/bol-email/send', {
      ship_date: shipDate,
      delivery_count: attachments.length,
      attachments,
      recipient_ids: [...checkedRecipientIds],
    });

    sendBtn.textContent = 'Send';
    sendBtn.disabled = false;

    if (!ok) {
      alert('Send failed: ' + (data?.error || error || 'Unknown error') + (data?.detail ? '\n' + data.detail : ''));
      return;
    }

    const toast = document.createElement('div');
    toast.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:12px 24px;border-radius:10px;font-size:14px;z-index:10000;';
    toast.innerHTML = `<span style="color:#34d399;">✓</span> Sent ${data.sent} BOL${data.sent === 1 ? '' : 's'} to ${data.recipients} recipient${data.recipients === 1 ? '' : 's'}`;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);

    loadCandidates();
    loadRecipients();
  };

  loadCandidates();
  loadRecipients();
  loadHolidays();
})();
</script>

</body>
