<!doctype html>
<html lang="en">
<head>
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('xpanda-theme') || 'dark');</script>
  <meta charset="UTF-8" />
  <title>Change Password — xPanda Ops</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="/assets/img/favicon.png" sizes="any">
  <link rel="stylesheet" href="/shared/tokens.css">
  <script src="/shared/i18n.js"></script>
  <script src="/shared/i18n-common.js"></script>
  <!-- account-pw-01: voluntary self-service password change. Any signed-in user (no permission key —
       /account/ matches nothing in PATH_PERMISSION_MAP; the session gate redirects signed-out
       visitors to /login). Backend: POST /api/auth/change-password (routes/auth.js). Reached from
       the legacy settings gear (shared-header.js) and the v2 PlatformHeader. -->
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .pw-wrap { width: 100%; padding: 24px 16px; display: flex; justify-content: center; }
    .pw-card {
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--line);
      padding: 32px 28px;
      width: 100%;
      max-width: 400px;
    }
    h1 { font-size: 20px; font-weight: 700; margin-bottom: 20px; }
    .pw-field { margin-bottom: 14px; }
    .pw-field label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
    .pw-input-row { display: flex; gap: 8px; }
    .pw-field input {
      flex: 1;
      min-height: 44px;
      padding: 10px 12px;
      font-size: 15px;
      border: 1px solid var(--input-border);
      border-radius: 8px;
      background: var(--input-bg);
      color: var(--text);
    }
    .pw-field input:focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; }
    .pw-toggle {
      min-height: 44px;
      min-width: 64px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .pw-hint { font-size: 12px; color: var(--muted); margin: -6px 0 14px; }
    .pw-error {
      font-size: 13px;
      font-weight: 600;
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 14px;
      background: var(--danger-bg);
      color: var(--danger-text);
    }
    .pw-error[hidden], .pw-success[hidden], form[hidden] { display: none; }
    .pw-btn {
      width: 100%;
      min-height: 44px;
      border: none;
      border-radius: 8px;
      background: var(--primary-bg);
      color: white; /* same as login.html's primary button */
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    .pw-btn:disabled { opacity: .5; cursor: not-allowed; }
    .pw-btn-secondary {
      width: 100%;
      min-height: 44px;
      margin-top: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: transparent;
      color: var(--text);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .pw-success p { font-size: 15px; margin-bottom: 6px; }
    .pw-success p.muted { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div class="pw-wrap">
    <div class="pw-card">
      <h1 data-i18n="common.changePassword">Change password</h1>

      <div id="pw-error" class="pw-error" role="alert" hidden></div>

      <form id="pw-form" novalidate>
        <div class="pw-field">
          <label for="pw-current" data-i18n="common.currentPassword">Current password</label>
          <div class="pw-input-row">
            <input id="pw-current" type="password" autocomplete="current-password" required>
            <button type="button" class="pw-toggle" data-target="pw-current">Show</button>
          </div>
        </div>
        <div class="pw-field">
          <label for="pw-new" data-i18n="common.newPassword">New password</label>
          <div class="pw-input-row">
            <input id="pw-new" type="password" autocomplete="new-password" minlength="8" required>
            <button type="button" class="pw-toggle" data-target="pw-new">Show</button>
          </div>
        </div>
        <p class="pw-hint" data-i18n="common.passwordMinLength">New password must be at least 8 characters.</p>
        <div class="pw-field">
          <label for="pw-confirm" data-i18n="common.confirmNewPassword">Confirm new password</label>
          <div class="pw-input-row">
            <input id="pw-confirm" type="password" autocomplete="new-password" minlength="8" required>
            <button type="button" class="pw-toggle" data-target="pw-confirm">Show</button>
          </div>
        </div>
        <button id="pw-submit" type="submit" class="pw-btn" data-i18n="common.changePassword">Change password</button>
        <button type="button" class="pw-btn-secondary js-back" data-i18n="common.back">Back</button>
      </form>

      <div id="pw-success" class="pw-success" role="status" hidden>
        <p data-i18n="common.passwordChanged">Password changed.</p>
        <p class="muted" data-i18n="common.passwordChangedOtherDevices">You've been signed out on your other devices.</p>
        <button type="button" class="pw-btn js-back" data-i18n="common.back">Back</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var MIN_LEN = 8; // matches MIN_PASSWORD_LENGTH in _worker.js/routes/auth.js
      function t(key, fallback) {
        var v = window.I18n ? window.I18n.t(key) : key;
        return v === key ? fallback : v;
      }
      var form = document.getElementById('pw-form');
      var errBox = document.getElementById('pw-error');
      var success = document.getElementById('pw-success');
      var submit = document.getElementById('pw-submit');

      function showError(msg) { errBox.textContent = msg; errBox.hidden = false; }
      function clearError() { errBox.textContent = ''; errBox.hidden = true; }

      // Back: previous page if there is one, else home. No ?return= param (no open-redirect surface).
      document.querySelectorAll('.js-back').forEach(function (b) {
        b.addEventListener('click', function () {
          if (history.length > 1) history.back(); else location.href = '/';
        });
      });

      document.querySelectorAll('.pw-toggle').forEach(function (b) {
        b.addEventListener('click', function () {
          var input = document.getElementById(b.getAttribute('data-target'));
          var show = input.type === 'password';
          input.type = show ? 'text' : 'password';
          b.textContent = show ? 'Hide' : 'Show';
        });
      });

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        clearError();
        var current = document.getElementById('pw-current').value;
        var next = document.getElementById('pw-new').value;
        var confirm = document.getElementById('pw-confirm').value;

        if (!current || !next || !confirm) return showError(t('common.passwordFillAll', 'Fill in all three fields.'));
        if (next.length < MIN_LEN) return showError(t('common.passwordMinLength', 'New password must be at least 8 characters.'));
        if (next !== confirm) return showError(t('common.passwordsDontMatch', "New passwords don't match."));
        if (next === current) return showError(t('common.passwordSameAsCurrent', 'New password must be different from your current password.'));

        submit.disabled = true;
        var label = submit.textContent;
        submit.textContent = t('common.passwordSaving', 'Saving…');
        try {
          var res = await fetch('/api/auth/change-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'same-origin',
            body: JSON.stringify({ current_password: current, new_password: next })
          });
          var body = await res.json().catch(function () { return {}; });
          if (!res.ok || !body.ok) {
            // Server error strings are already user-facing — show verbatim.
            showError(body.error || ('Request failed (' + res.status + ').'));
            return;
          }
          form.hidden = true;
          success.hidden = false;
        } catch (err) {
          showError('Network error — could not reach the server.');
        } finally {
          submit.disabled = false;
          submit.textContent = label;
        }
      });
    })();
  </script>
</body>
</html>
