<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>xPanda Foam – Incident Report</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="manifest" href="/manifest.json">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">

    <link rel="icon" href="/qc-assets/qc-favicon.png" sizes="any">
<link rel="apple-touch-icon" href="/qc-assets/qc-favicon.png">

  <link rel="stylesheet" href="/qc/qc-shared.css">
  <style>
    .page-wrap {
      padding: 16px;
      max-width: 960px;
      margin: 0 auto;
    }

    h1 {
      font-size: 18px;
      margin: 0 0 10px;
    }

    label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin: 10px 0 4px;
    }

    input, select, textarea {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid var(--input-border);
      border-radius: 10px;
      padding: 10px;
      font-size: 14px;
      background: var(--input-bg);
      color: var(--text);
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    @media (min-width: 860px) {
      .grid.two { grid-template-columns: 1fr 1fr; }
      .grid.three { grid-template-columns: 1fr 1fr 1fr; }
    }

    .sticky {
      position: sticky;
      top: 0;
      z-index: 5;
      background: var(--bg);
      padding: 8px 0 10px;
      margin-bottom: 10px;
    }

    .bar {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 10px;
    }

    .bar .left {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .bar .right {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .row > * {
      flex: 1;
    }

    .add-customer-row input {
      flex: 1;
    }

    .add-customer-row button {
      flex: 0 0 auto;
      white-space: nowrap;
    }

    .checks {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 6px;
    }

    .check-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid var(--input-border);
      border-radius: 10px;
      background: var(--input-bg);
    }

    .check-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      margin: 0;
      flex: 0 0 auto;
    }

    .small {
      font-size: 12px;
      color: var(--pill);
      margin-top: 6px;
    }

    .ok { color: #0b7a28; font-weight: 700; }
    .warn { color: #b35c00; font-weight: 700; }
    .err { color: #b00020; font-weight: 700; }

    @media (max-width: 480px) {
      .page-wrap {
        padding: 12px;
      }

      .bar {
        flex-direction: column;
        align-items: stretch;
      }

      .bar .right {
        flex-wrap: wrap;
      }
    }
  </style>
</head>
<body>

  <script src="/qc/qc-header.js"></script>
  <script>
    function tt(key, fallback) { return window.I18n ? window.I18n.t(key) : fallback; }
    document.getElementById('qc-page-title').textContent = tt('layout.incidentReportTitle', 'Incident Report');
    document.getElementById('qc-page-subtitle').textContent = tt('layout.incidentReportSubtitle', 'Document quality-related incidents for customer, product, and process issues');
  </script>

  <div class="page-wrap">

    <div class="sticky">
      <div class="bar">
        <div class="left">
          <div><strong data-i18n="layout.incidentReportTitle">Incident Report</strong></div>
          <div class="pill" id="statusPill">Ready</div>
        </div>
        <div class="right">
          <button class="btn ghost" type="button" id="resetBtn" data-i18n="qc.resetBtn">Reset</button>
          <button class="btn primary" type="button" id="submitBtn" data-i18n="qc.submitBtn">Submit</button>
        </div>
      </div>
    </div>

    <div class="card">
      <h1 data-i18n="qc.reportInfoHeading">Report Info</h1>

      <div class="grid two">
        <div>
          <label for="date" data-i18n="qc.dateLabel">Date</label>
          <input id="date" />
        </div>
        <div>
          <label for="personCompleting" data-i18n="qc.personCompletingLabel">Person Completing Report</label>
          <input id="personCompleting" value="Stephen Cook" autocomplete="off" />
        </div>
      </div>

      <div>
        <label for="reportingIndividual" data-i18n="qc.reportingIndividualLabel">Reporting Individual</label>
        <input id="reportingIndividual" autocomplete="off" />
      </div>
    </div>

    <div class="card">
      <h1 data-i18n="qc.incidentInfoHeading">Incident Information</h1>

      <div class="grid two">
        <div>
          <label for="customerSelect" data-i18n="qc.customerNameLabel">Customer Name</label>
          <select id="customerSelect">
            <option value="" data-i18n="qc.loadingCustomers">Loading customers...</option>
          </select>
        </div>

        <div>
          <label for="newCustomer" data-i18n="qc.addNewCustomerLabel">Add New Customer</label>
          <div class="row add-customer-row">
            <input id="newCustomer" placeholder="Enter new customer name..." data-i18n-placeholder="qc.enterNewCustomerPlaceholder" />
            <button class="btn ghost" type="button" id="addCustomerBtn" data-i18n="qc.addBtn">Add</button>
          </div>
          <div class="small" data-i18n="qc.onlyIfNotInDropdown">Only use if customer is not in dropdown.</div>
        </div>
      </div>

      <div class="grid three">
        <div>
          <label for="jobId" data-i18n="qc.jobIdLabel">Job ID</label>
          <input id="jobId" autocomplete="off" />
        </div>
        <div>
          <label for="productDelivered" data-i18n="qc.productDeliveredLabel">Product Delivered</label>
          <select id="productDelivered">
            <option value="" data-i18n="qc.selectProduct">Select product...</option>
            <option value="Block" data-i18n="qc.productBlock">Block</option>
            <option value="Holey Board" data-i18n="qc.productHoleyBoard">Holey Board</option>
            <option value="Sheets" data-i18n="qc.productSheets">Sheets</option>
            <option value="Other" data-i18n="qc.productOther">Other</option>
          </select>
        </div>
        <div>
          <label for="deliveryDate" data-i18n="qc.deliveryDateLabel">Delivery Date</label>
          <input id="deliveryDate" />
        </div>
      </div>

      <div>
        <label for="incidentCategory" data-i18n="qc.incidentCategoryLabel">Incident Category</label>
        <select id="incidentCategory">
          <option value="" data-i18n="qc.selectCategory">Select category...</option>
          <option value="Fusion" data-i18n="qc.categoryFusion">Fusion</option>
          <option value="Density" data-i18n="qc.categoryDensity">Density</option>
          <option value="Tolerances" data-i18n="qc.categoryTolerances">Tolerances</option>
          <option value="Packaging" data-i18n="qc.categoryPackaging">Packaging</option>
          <option value="Delivery" data-i18n="qc.categoryDelivery">Delivery</option>
          <option value="Other" data-i18n="qc.categoryOther">Other</option>
        </select>
      </div>

        <div>
         <label for="riskLevel" data-i18n="qc.riskLevelLabel">Risk Level</label>
         <select id="riskLevel">
         <option value="" data-i18n="qc.selectRiskLevel">Select risk level...</option>
         <option value="Low" data-i18n="qc.riskLow">Low</option>
         <option value="Medium" data-i18n="qc.riskMedium">Medium</option>
         <option value="High" data-i18n="qc.riskHigh">High</option>
        </select>
    </div>
      <div>
        <label for="incidentDetails" data-i18n="qc.incidentDetailsLabel">Incident Details</label>
        <textarea id="incidentDetails" placeholder="Describe the incident in clear detail..." data-i18n-placeholder="qc.describeIncidentPlaceholder"></textarea>
      </div>
    </div>

    <div class="card">
      <h1 data-i18n="qc.rootCauseHeading">Root Cause and Corrective Action</h1>

      <div>
        <label for="rootCauseDescription" data-i18n="qc.rootCauseDescLabel">Root Cause Description</label>
        <textarea id="rootCauseDescription" placeholder="Optional at initial submission..." data-i18n-placeholder="qc.optionalAtInitialPlaceholder"></textarea>
      </div>

      <div>
        <label data-i18n="qc.implicatedDeptsLabel">Implicated Departments</label>
        <div class="checks">
          <label class="check-item"><input type="checkbox" value="Molding"> <span data-i18n="qc.deptMolding">Molding</span></label>
          <label class="check-item"><input type="checkbox" value="Cutting"> <span data-i18n="qc.deptCutting">Cutting</span></label>
          <label class="check-item"><input type="checkbox" value="Packaging and Loading"> <span data-i18n="qc.deptPackagingLoading">Packaging and Loading</span></label>
          <label class="check-item"><input type="checkbox" value="Delivery"> <span data-i18n="qc.deptDelivery">Delivery</span></label>
        </div>
      </div>

      <div>
        <label for="correctiveActions" data-i18n="qc.correctiveActionsLabel">Corrective Actions</label>
        <textarea id="correctiveActions" placeholder="Optional at initial submission..." data-i18n-placeholder="qc.optionalAtInitialPlaceholder"></textarea>
      </div>
    </div>

    <form id="postForm" method="post" target="submitFrame" action="">
      <input type="hidden" name="payload" id="payload" value="" />
    </form>

    <iframe name="submitFrame" style="display:none;"></iframe>

  </div>

  <script>
    // ====== CONFIG ======
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwCULfoSrZQCcbKm2vRG5GWQHQhplfSDgX81mre6RaocuVT5FrNlZm0FN7agm64yczZ/exec";

    // ====== ELEMENTS ======
    const statusPill = document.getElementById('statusPill');

    const dateEl = document.getElementById('date');
    const personCompleting = document.getElementById('personCompleting');
    const reportingIndividual = document.getElementById('reportingIndividual');

    const customerSelect = document.getElementById('customerSelect');
    const newCustomerInput = document.getElementById('newCustomer');
    const addCustomerBtn = document.getElementById('addCustomerBtn');

    const jobId = document.getElementById('jobId');
    const productDelivered = document.getElementById('productDelivered');
    const deliveryDate = document.getElementById('deliveryDate');
    const incidentCategory = document.getElementById('incidentCategory');
    const incidentDetails = document.getElementById('incidentDetails');

    const rootCauseDescription = document.getElementById('rootCauseDescription');
    const correctiveActions = document.getElementById('correctiveActions');

      const riskLevel = document.getElementById('riskLevel');
      
    const resetBtn = document.getElementById('resetBtn');
    const submitBtn = document.getElementById('submitBtn');

    const postForm = document.getElementById('postForm');
    const payloadEl = document.getElementById('payload');

    // ====== HELPERS ======
    function t(key, vars) { return window.I18n ? window.I18n.t(key, vars) : key; }

    // statusPill has no static data-i18n tag: JS is its sole writer (init seeds it),
    // same pattern used on final-inspection.html -- a static tag would collide with
    // setStatus()'s dynamic messages on langchange.
    function setStatus(text, cls) {
      statusPill.textContent = text;
      statusPill.className = 'pill ' + (cls || '');
    }


    function getCheckedDepartments() {
      return Array.from(document.querySelectorAll('.checks input[type="checkbox"]:checked'))
        .map(cb => cb.value);
    }

    function populateCustomerSelect(list, selectedValue = '') {
      customerSelect.innerHTML = `<option value="">${t('qc.selectCustomer')}</option>`;

      list.forEach(name => {
        const opt = document.createElement('option');
        opt.value = name;
        opt.textContent = name;
        customerSelect.appendChild(opt);
      });

      if (selectedValue && list.includes(selectedValue)) {
        customerSelect.value = selectedValue;
      }
    }

    function resetAll() {
      dateEl.value = utils.todayIso();
      personCompleting.value = 'Stephen Cook';
      reportingIndividual.value = '';
      customerSelect.value = '';
      newCustomerInput.value = '';
      jobId.value = '';
      productDelivered.value = '';
      deliveryDate.value = '';
      incidentCategory.value = '';
      incidentDetails.value = '';
      rootCauseDescription.value = '';
      correctiveActions.value = '';
        riskLevel.value = '';
      document.querySelectorAll('.checks input[type="checkbox"]').forEach(cb => {
        cb.checked = false;
      });

      setStatus(t('qc.statusReady'), '');
    }

    async function loadCustomers() {
      if (!GAS_URL) {
        customerSelect.innerHTML = `<option value="">${t('qc.appsScriptUrlNotSet')}</option>`;
        return;
      }

      try {
        const { data: list } = await window.api.get(GAS_URL + "?action=getIncidentCustomers");

        if (!Array.isArray(list)) {
          throw new Error('Invalid customer list response');
        }

        populateCustomerSelect(list);
      } catch (err) {
        customerSelect.innerHTML = `<option value="">${t('qc.failedToLoad')}</option>`;
        setStatus(t('qc.customerListFailed'), 'warn');
      }
    }

    // ====== INIT ======
    (function init() {
      dateEl.value = utils.todayIso();
      loadCustomers();
      setStatus(t('qc.statusReady'), '');
    })();

    // ====== EVENTS ======
    resetBtn.addEventListener('click', () => resetAll());

    addCustomerBtn.addEventListener('click', async () => {
      const name = newCustomerInput.value.trim();

      if (!name) {
        setStatus(t('qc.errEnterCustomerName'), 'err');
        return;
      }

      if (!GAS_URL) {
        setStatus(t('qc.appsScriptUrlNotSet'), 'warn');
        return;
      }

      setStatus(t('qc.addingCustomerEllipsis'), '');

      try {
        const { data: list } = await window.api.get(
          GAS_URL + "?action=addIncidentCustomer&name=" + encodeURIComponent(name)
        );

        if (!Array.isArray(list)) {
          throw new Error('Invalid add customer response');
        }

        newCustomerInput.value = '';
        populateCustomerSelect(list, name);
        setStatus(t('qc.customerAdded'), 'ok');
      } catch (err) {
        setStatus(t('qc.addFailed'), 'err');
      }
    });

    submitBtn.addEventListener('click', () => {
      if (!dateEl.value.trim()) return setStatus(t('qc.errDateRequired'), 'err');
      if (!personCompleting.value.trim()) return setStatus(t('qc.errPersonCompletingRequired'), 'err');
      if (!customerSelect.value) return setStatus(t('qc.errSelectCustomer'), 'err');
      if (!productDelivered.value) return setStatus(t('qc.errSelectProductDelivered'), 'err');
      if (!incidentCategory.value) return setStatus(t('qc.errSelectIncidentCategory'), 'err');
      if (!incidentDetails.value.trim()) return setStatus(t('qc.errIncidentDetailsRequired'), 'err');
        if (!riskLevel.value) return setStatus(t('qc.errSelectRiskLevel'), 'err');

      const payload = {
        action: "createIncidentReport",
        date: dateEl.value.trim(),
        personCompletingReport: personCompleting.value.trim(),
        reportingIndividual: reportingIndividual.value.trim(),
        customer: customerSelect.value,
        jobId: jobId.value.trim(),
        productDelivered: productDelivered.value,
        deliveryDate: deliveryDate.value.trim(),
        incidentCategory: incidentCategory.value,
        incidentDetails: incidentDetails.value.trim(),
        rootCauseDescription: rootCauseDescription.value.trim(),
        implicatedDepartments: getCheckedDepartments(),
        correctiveActions: correctiveActions.value.trim(),
          riskLevel: riskLevel.value,
      };

      if (!GAS_URL) {
        setStatus(t('qc.htmlReadyAddUrl'), 'warn');
        return;
      }

      setStatus(t('qc.submittingEllipsis'), '');

      postForm.action = GAS_URL;
      payloadEl.value = JSON.stringify(payload);
      postForm.submit();

      setStatus(t('qc.submittedCheckDrive'), 'ok');
    });
  </script>

</body>
</html>
